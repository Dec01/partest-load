[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partest-load"
version = "0.1.0"
description = "Нагрузочный харнесс семейства partest: профили по времени, метрики насыщения и деградации"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dec01" }]
keywords = ["load testing", "stress testing", "performance", "api", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Testing :: Traffic Generation",
]

dependencies = [
    "partest>=1.8",
    # Именно с extra http2: клиент создаётся с http2=True, и без пакета `h2` httpx бросает
    # ImportError при создании клиента — то есть ни один воркер не отправляет ни одного
    # запроса. Перевести клиент на HTTP/1.1 было бы тише, но это другие измерения: у
    # мультиплексирования соединений своя кривая насыщения.
    "httpx[http2]>=0.27.2",
    "PyYAML>=6.0.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Дашборд не нужен тому, кто снимает только артефакт для карты, — а numpy/pandas/plotly
# весят больше, чем всё остальное вместе.
report = ["numpy>=1.24", "pandas>=2.0", "plotly>=5.18", "Jinja2>=3.1"]
all = ["partest-load[report]"]

[project.scripts]
partest-load = "partest_load.cli:main"

[tool.setuptools.packages.find]
include = ["partest_load*"]

# Шаблоны дашборда — данные, а не код, и сами в колесо не попадают. Без этой строки пакет
# устанавливается целиком, а `generate_dashboard` падает на отсутствующем шаблоне уже у
# потребителя — после прогона, то есть в самый дорогой момент.
[tool.setuptools.package-data]
partest_load = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
# Без этого `pytest` в корне репозитория падает на `import partest_load`: корень в путь
# импорта не попадает. Ворота зелены только потому, что запускают `python -m pytest`,
# а он добавляет текущий каталог сам — то есть проверка работала у инструмента и не
# работала у человека.
pythonpath = ["."]
testpaths = ["tests"]
# Область цикла событий объявлена явно: без неё pytest-asyncio печатает предупреждение
# о смене умолчания в каждом прогоне, и оно приучает не читать вывод.
asyncio_default_fixture_loop_scope = "function"
