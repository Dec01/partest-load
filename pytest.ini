[pytest]
# Без этого `pytest` в корне репозитория падает на `import partest_load`: корень в путь
# импорта не попадает. Ворота зелены только потому, что запускают `python -m pytest`,
# а он добавляет текущий каталог сам — то есть проверка работала у инструмента и не
# работала у человека.
pythonpath = .
testpaths = tests
# Область цикла событий объявлена явно: без неё pytest-asyncio печатает предупреждение
# о смене умолчания в каждом прогоне, и оно приучает не читать вывод.
asyncio_default_fixture_loop_scope = function
